<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSCMS v14 · 全域监控大盘</title>
<style>
:root{
  --bg:#0d1117; --bg2:#161b22; --bg3:#1c2330; --bord:#2a3342;
  --txt:#e6edf3; --mut:#8b97a7; --mut2:#5b6675;
  --acc:#3b82f6; --grn:#2ea043; --yel:#d29922; --red:#f85149; --pur:#a371f7; --cyn:#39c5cf;
  --bar1:#3b82f6; --bar2:#2ea043; --bar3:#a371f7; --bar4:#d29922; --bar5:#39c5cf; --bar6:#f85149;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font:13px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;display:flex;height:100vh;overflow:hidden}
a{color:var(--acc);text-decoration:none}
button{font:inherit;cursor:pointer;color:var(--txt);background:var(--bg3);border:1px solid var(--bord);border-radius:6px;padding:5px 11px}
button:hover{border-color:var(--acc)}
button.prim{background:var(--acc);border-color:var(--acc);color:#fff}
button.ghost{background:transparent}
/* sidebar */
#side{width:236px;background:var(--bg2);border-right:1px solid var(--bord);display:flex;flex-direction:column;overflow-y:auto}
#brand{padding:14px 16px;border-bottom:1px solid var(--bord)}
#brand h1{font-size:14px;letter-spacing:.3px}
#brand .sub{color:var(--mut);font-size:11px;margin-top:3px}
.mi{padding:9px 14px;cursor:pointer;border-left:3px solid transparent;display:flex;align-items:center;gap:9px;user-select:none}
.mi:hover{background:var(--bg3)}
.mi.on{background:var(--bg3);border-left-color:var(--acc)}
.mi .ic{font-size:15px;width:20px;text-align:center}
.mi .lbl{font-size:12.5px;flex:1}
.mi .bad{font-size:10px;color:var(--mut);background:var(--bg);border:1px solid var(--bord);border-radius:10px;padding:1px 7px}
.subtabs{padding:6px 10px 6px 18px}
.subtab{padding:6px 12px;margin:3px 0;cursor:pointer;border-radius:6px;color:var(--mut);font-size:12px;border:1px solid transparent}
.subtab:hover{color:var(--txt);background:var(--bg3)}
.subtab.on{color:var(--txt);background:var(--bg3);border-color:var(--bord)}
/* main */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}
#topbar{padding:11px 18px;border-bottom:1px solid var(--bord);display:flex;align-items:center;gap:14px;background:var(--bg2)}
#topbar .ttl{font-size:15px;font-weight:600}
#topbar .crumb{color:var(--mut);font-size:12px}
#topbar .sp{flex:1}
#topbar .st{font-size:11px;color:var(--mut)}
#topbar .live{display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--grn);box-shadow:0 0 8px var(--grn)}
.dot.off{background:var(--red);box-shadow:0 0 8px var(--red)}
#scroll{flex:1;overflow-y:auto;padding:16px 18px}
/* grid */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.panel{background:var(--bg2);border:1px solid var(--bord);border-radius:10px;padding:14px}
.panel h3{font-size:12.5px;color:var(--mut);margin-bottom:10px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;display:flex;align-items:center;gap:7px}
.kpi{display:flex;flex-direction:column;gap:3px}
.kpi .v{font-size:26px;font-weight:700;line-height:1}
.kpi .l{color:var(--mut);font-size:11.5px}
.kpi .d{font-size:11px}
.up{color:var(--grn)} .down{color:var(--red)}
table{;border-collapse:collapse;font-size:12px}
th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--bord)}
th{color:var(--mut);font-weight:600;font-size:11px;position:sticky;top:0;background:var(--bg2);cursor:default}
tr.row{cursor:pointer}
tr.row:hover{background:var(--bg3)}
.clickable{cursor:pointer;transition:transform .08s,box-shadow .12s,border-color .12s}
[data-i].clickable:hover,[data-ph].clickable:hover{border-color:var(--acc)!important;box-shadow:0 0 0 1px var(--acc);transform:translateY(-1px)}
td .pill{font-size:10px;padding:1px 7px;border-radius:10px;border:1px solid var(--bord)}
.p-on{color:var(--grn);border-color:var(--grn)} .p-err{color:var(--red);border-color:var(--red)} .p-warn{color:var(--yel);border-color:var(--yel)} .p-off{color:var(--mut2);border-color:var(--mut2)}
.bar{height:7px;background:var(--bg);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px}
.minibar{height:6px;background:var(--bg);border-radius:4px;overflow:hidden;min-width:40px}
.minibar>i{display:block;height:100%}
.heat{display:grid;gap:3px}
.cell{;aspect-ratio:1;border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:9px;color:#fff}
.section-h{font-size:13px;font-weight:600;margin:4px 0 10px;display:flex;align-items:center;gap:8px}
.section-h .tag{font-size:10px;color:var(--mut);font-weight:400}
.lvl{font-size:10px;color:var(--mut2);border:1px solid var(--bord);border-radius:4px;padding:1px 5px;margin-left:6px}
.funnel-row{display:flex;align-items:center;gap:10px;margin:7px 0}
.funnel-row .lab{width:130px;font-size:12px;color:var(--mut)}
.funnel-row .trk{flex:1;background:var(--bg);border-radius:6px;height:26px;overflow:hidden;position:relative}
.funnel-row .trk>i{display:block;height:100%;border-radius:6px}
.funnel-row .num{width:64px;text-align:right;font-variant-numeric:tabular-nums}
.tip{font-size:11px;color:var(--mut);margin-top:8px}
/* drawer */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:40}
#drawer{position:fixed;top:0;right:0;height:100%;width:min(560px,92vw);background:var(--bg2);border-left:1px solid var(--bord);transform:translateX(100%);transition:.2s;z-index:50;display:flex;flex-direction:column}
#drawer.open{transform:translateX(0)}
#dh{padding:13px 16px;border-bottom:1px solid var(--bord);display:flex;align-items:center;gap:10px}
#dh .t{font-size:14px;font-weight:600;flex:1}
#dbody{flex:1;overflow-y:auto;padding:16px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:7px 10px;font-size:12px}
.kv .k{color:var(--mut)}
pre.raw{background:var(--bg);border:1px solid var(--bord);border-radius:8px;padding:11px;font:11px/1.45 ui-monospace,Menlo,Consolas,monospace;color:var(--cyn);white-space:pre-wrap;max-height:46vh;overflow:auto}
.empty{color:var(--mut);padding:20px;text-align:center}
.big{font-size:13px;color:var(--txt)}
.big b{font-size:26px;color:var(--grn)}
/* timeline */
.timeline{display:flex;flex-direction:column;gap:0;padding:6px 0}
.tl-item{display:flex;gap:12px;padding:9px 8px;border-radius:8px}
.tl-item:hover{background:var(--bg3)}
.tl-dot{width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--mut);margin-top:3px;flex:none}
.tl-dot.done{background:var(--grn);border-color:var(--grn)}
.tl-dot.run{background:var(--yel);border-color:var(--yel);box-shadow:0 0 0 4px rgba(210,153,34,.18)}
.tl-body{display:flex;flex-direction:column}
.tl-meta{font-size:11px;color:var(--mut)}
/* AI NL */
.ai-out{background:var(--bg);border:1px solid var(--bord);border-radius:8px;padding:12px;min-height:140px;max-height:46vh;overflow:auto;margin-bottom:10px}
.ai-q{color:var(--blu);font-weight:600;margin:8px 0 3px}
.ai-a{color:var(--txt);margin:4px 0 8px;white-space:pre-wrap}
.ai-bar{display:flex;gap:8px}
.ai-inp{flex:1;background:var(--bg);border:1px solid var(--bord);border-radius:7px;padding:9px 11px;color:var(--txt);font-size:13px}
.ai-btn{background:var(--acc);color:#fff;border:0;border-radius:7px;padding:0 18px;cursor:pointer;font-weight:600}
.ai-btn:hover{filter:brightness(1.1)}

.seg{display:inline-flex;border:1px solid var(--bord);border-radius:7px;overflow:hidden}
.seg button{border:0;border-radius:0;border-right:1px solid var(--bord);padding:4px 10px}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--acc);color:#fff}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.brandmark{font-size:11px}
/* quick-task form */
.form{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.form label{font-size:11px;color:var(--mut);margin-top:6px}
.form input,.form select,.form {background:var(--bg);border:1px solid var(--bord);border-radius:6px;padding:8px 10px;color:var(--txt);font-size:12px;font-family:inherit}
.form {resize:vertical}
.form .ai-btn{margin-top:12px;padding:9px 18px;align-self:flex-start}

/* ── 内容编辑器（短视频≤10s / 图文） ── */
.ce-types{display:flex;gap:10px;margin:2px 0 6px}
.ce-type-btn{background:var(--bg);border:1px solid var(--bord);border-radius:8px;padding:9px 14px;color:var(--txt);cursor:pointer;font-size:13px;font-weight:600;transition:.15s}
.ce-type-btn:hover{border-color:var(--acc)}
.ce-type-btn.on{background:var(--acc);border-color:var(--acc);color:#fff}
.ce-err{color:var(--red);font-size:11px;min-height:14px}
.ce-img-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.ce-img-chip{position:relative;width:74px;height:74px;border-radius:8px;overflow:hidden;border:1px solid var(--bord);background:var(--bg)}
.ce-img-chip img{;height:100%;object-fit:cover}
.ce-img-chip .x{position:absolute;top:2px;right:2px;width:18px;height:18px;line-height:16px;text-align:center;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:12px}
.ce-preview{background:var(--bg);border:1px solid var(--bord);border-radius:10px;padding:12px;min-height:200px}
.ce-prev-video{;border-radius:8px;background:#000;max-height:320px}
.ce-prev-thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin:8px 0}
.ce-prev-thumbs img{;height:110px;object-fit:cover;border-radius:6px}
.ce-prev-cap{white-space:pre-wrap;font-size:13px;line-height:1.5;margin-top:8px;color:var(--txt)}
.ce-prev-meta{font-size:11px;color:var(--mut);margin-top:6px}
.ce-ratio{background:var(--bg);border:1px solid var(--bord);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.ce-ratio-bar{position:relative;height:18px;background:var(--bord);border-radius:9px;overflow:hidden;margin:8px 0}
.ce-ratio-fill{height:100%;border-radius:9px;transition:width .4s}
.ce-ratio-target{position:absolute;top:-3px;bottom:-3px;width:2px;background:#fff;opacity:.8}
.ce-ratio-target::after{content:'目标70%';position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--mut);white-space:nowrap}
.type-badge{display:inline-block;padding:1px 8px;border-radius:20px;font-size:11px;font-weight:600}
.tb-video{background:rgba(57,197,207,.18);color:#39c5cf}
.tb-image_text{background:rgba(210,153,34,.18);color:#e3b341}
.tb-text{background:rgba(139,148,158,.18);color:#9da7b3}
.ce-lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ce-lib-card{background:var(--bg);border:1px solid var(--bord);border-radius:10px;overflow:hidden;cursor:pointer}
.ce-lib-card:hover{border-color:var(--acc)}
.ce-lib-thumb{height:96px;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ce-lib-thumb img{;height:100%;object-fit:cover}
.ce-lib-thumb .ph{color:var(--mut);font-size:11px}
.ce-lib-meta{padding:7px 9px}
.ce-lib-meta .t{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ce-lib-meta .s{font-size:10px;color:var(--mut);margin-top:2px}

/* ── 智能菜单搜索（信息架构 v2） ── */
.msearch{position:relative;padding:8px 10px;border-bottom:1px solid var(--bord)}
.msearch input{;background:var(--bg);border:1px solid var(--bord);border-radius:6px;color:var(--txt);font:inherit;font-size:12px;padding:6px 24px 6px 9px;outline:none}
.msearch input:focus{border-color:var(--acc)}
.msearch #mqx{position:absolute;right:18px;top:50%;transform:translateY(-50%);color:var(--mut);cursor:pointer;font-size:14px;line-height:1;padding:2px 4px}
.msearch #mqx:hover{color:var(--txt)}
.mqempty{padding:14px;color:var(--mut2);font-size:12px;text-align:center}
.mi .ic{font-size:15px}
.subtab{padding:6px 12px}
#brand .sub{color:var(--mut);font-size:11px;margin-top:3px}

.freqbar{display:flex;flex-wrap:wrap;gap:4px;padding:7px 10px 9px;border-bottom:1px solid var(--bord)}
.fq-t{;font-size:10px;color:var(--mut2);letter-spacing:.08em;margin-bottom:3px}
.fq{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:3px 8px;border-radius:20px;background:var(--bg3);color:var(--mut);cursor:pointer;border:1px solid transparent;white-space:nowrap;max-}
.fq:hover{border-color:var(--acc);color:var(--txt)}
.fq .n{color:var(--mut2);font-size:10px}
</style>
</head>
<body>
<div id="side"></div>
<div id="main">
  <div id="topbar">
    <div>
      <div class="ttl" id="ttl">监控大盘</div>
      <div class="crumb" id="crumb">加载中…</div>
    </div>
    <div class="sp"></div>
    <!-- 【B5】全局时间维度控件宿主：今日 | 本周 | 本月 | 本年 | 自定义。
         所有图表/列表共享同一维度；选择结果写入 localStorage，跨页面保持一致。 -->
    <span id="tdhost"></span>
    <div class="st" id="lastup">—</div>
    <div class="live"><span class="dot" id="livedot"></span><span id="livetxt" class="st">手动</span></div>
    <!-- 【B5】原 #refreshseg 分段控件（手动/5s/15s/1m/10m/实时）已整体移除：
         按用户要求「取消 5 / 10 刷新，只保留手动刷新按钮」。
         「实时」不是刷新频率而是【跳转到独立页】，故保留为独立按钮，避免 /v14-live.html 失去入口。 -->
    <button class="ghost" id="livebtn" title="打开秒级实时大盘（SSE 推送，独立页）">实时页</button>
    <button class="prim" id="refreshbtn">刷新</button>
  </div>
  <div id="scroll"></div>
</div>
<div id="scrim"></div>
<div id="drawer">
  <div id="dh"><div class="t" id="dh-t">详情</div><div class="sp" style="flex:1"></div><button class="ghost" id="dh-raw">原始(L6)</button><button class="ghost" id="dh-x">✕</button></div>
  <div id="dbody"></div>
</div>

<!-- 【B5】统一图表组件：时间维度控件 + 折线/柱/环/漏斗 + 迷你趋势列（零依赖，纯 SVG）
     必须在下面的内联脚本之前加载：内联脚本会立即调用 MSCMSChart.timeState / mountControl。 -->
<script src="v14-chart.js"></script>
<script>
const API = (p)=>fetch(p,{headers:{'Accept':'application/json'}}).then(r=>r.ok?r.json():Promise.reject(new Error(r.status+' '+p))).catch(e=>({__err__:String(e.message||e)}));
const $ = (s,r=document)=>r.querySelector(s);
const fmt = n=>{ if(n===null||n===undefined||isNaN(n)) return '0'; n=+n; if(n>=1e9)return (n/1e9).toFixed(1)+'B'; if(n>=1e6)return (n/1e6).toFixed(1)+'M'; if(n>=1e3)return (n/1e3).toFixed(1)+'K'; return ''+n; };
const esc = s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const pct = (a,b)=>{const A=numOf(a),B=(typeof b==='number'?b:numOf(b)); return B>0?Math.round(A/B*100):0;};
/* ---- 安全取值层：后端字段既可能是标量也可能是对象/字符串百分比，统一收敛，避免 [object Object] / NaN / .slice is not a  ---- */
const str = v=>String(v==null?'':v);
const numOf = v=>{ if(v==null) return 0; if(typeof v==='number') return isFinite(v)?v:0; if(typeof v==='object'){ if(typeof v.pending==='number') return v.pending; const ns=Object.values(v).filter(x=>typeof x==='number'&&isFinite(x)); return ns.length?ns.reduce((a,b)=>a+b,0):0; } const n=parseFloat(String(v).replace(/[%,]/g,'')); return isNaN(n)?0:n; };
const labelOf = v=>{ if(v==null) return '-'; if(typeof v==='object') return String(v.label||v.name||v.model||v.id||v.key||v.title||JSON.stringify(v)); return String(v); };
const pctStr = v=>{ if(v==null) return '0%'; if(typeof v==='string'){ const t=v.trim(); if(!t) return '0%'; return /%$/.test(t)?t:t+'%'; } const n=+v; if(!isFinite(n)) return '0%'; return (Math.abs(n)<=1?(n*100).toFixed(1):n.toFixed(1))+'%'; };
/* 对象型统计展开成「k=v」摘要，用于 KPI 副标题 */
const sumOf = v=>{ if(v==null||typeof v!=='object') return ''; return Object.entries(v).filter(([,x])=>typeof x==='number').map(([k,x])=>k+' '+x).join(' · '); };
/* ---- 展示名层（推广站前缀-序号）：display_name 由 tools/promo-names.js 生成， 是登录名，永不用展示名覆盖它 ---- */
const NAME_MAP = new Map();                 // id/ -> {display_name, promo_site, promo_url, }
let NAME_MAP_STATE = { at:0, ok:false };
let NAME_MAP_P = null;
async  loadNameMap(force){
  const now = Date.now();
  if(!force && NAME_MAP_STATE.ok && now - NAME_MAP_STATE.at < 5*60*1000) return NAME_MAP;
  if(NAME_MAP_P) return NAME_MAP_P;
  NAME_MAP_P = (async()=>{
    try{
      const ctl = (typeof AbortController!=='undefined') ? new AbortController() : null;
      const to = ctl ? setTimeout(()=>{try{ctl.abort()}catch(e){}}, 4000) : null;
      const j = await fetch('/api/',{headers:{'Accept':'application/json'},signal:ctl?ctl.signal:undefined}).then(r=>r.ok?r.json():null);
      if(to) clearTimeout(to);
      const rows = (j && (j. || j.items || j.data)) || [];
      if(Array.isArray(rows)) rows.forEach(a=>{
        if(!a || !a.id) return;
        NAME_MAP.set(String(a.id), {display_name:a.display_name||'', promo_site:a.promo_site||'', promo_url:a.promo_url||'', :a.||''});
        if(a.) NAME_MAP.set(String(a.), {display_name:a.display_name||'', promo_site:a.promo_site||'', promo_url:a.promo_url||'', :a.||''});
      });
      NAME_MAP_STATE = { at:Date.now(), ok:true };
    }catch(e){ NAME_MAP_STATE = { at:Date.now(), ok:false }; }
    NAME_MAP_P = null;
    return NAME_MAP;
  })();
  return NAME_MAP_P;
}
const nmKey = a => a ? String(a.id || a.account_id || a.accountId || a. || '') : '';
const nmMeta = a => NAME_MAP.get(nmKey(a)) || null;
const dnOf = a=>{ if(!a) return '-'; const m=nmMeta(a); return (m&&m.display_name) || a.display_name || a. || a.id || '-'; };
const unOf = a=>{ if(!a) return '-'; const m=nmMeta(a); return a. || (m&&m.) || a.id || '-'; };
const siteOf = a=>{ const m=nmMeta(a); return (m&&m.promo_site) || a.promo_site || ''; };
/* 账号单元格：主=展示名（hlua-001），副=登录名（灰色小字），便于对照又不丢登录凭据 */
 accCell(a){
  const d = esc(dnOf(a)), u = esc(unOf(a));
  return d + (u && u !== d ? ' <span style="color:var(--mut);font-size:10px">'+u+'</span>' : '');
}
/* 强制数组：后端字段可能返回对象/单值，统一收敛成数组，避免 .slice/.map/.filter is not a  */

/* ---------- SVG chart helpers (return markup) ---------- */
 donut(seg,size=150){ // seg:[{label,value,color}]
  const tot=seg.reduce((s,x)=>s+(+x.value||0),0)||1; let a=-Math.PI/2,t='';
  seg.forEach(x=>{const v=(+x.value||0)/tot*2*Math.PI; const a2=a+v; if(v<=0){return;}
    const r=size/2-12, cx=size/2, cy=size/2, r2=r-18;
    const large=v>Math.PI?1:0;
    const x1=cx+r*Math.cos(a),y1=cy+r*Math.sin(a),x2=cx+r*Math.cos(a2),y2=cy+r*Math.sin(a2);
    const x3=cx+r2*Math.cos(a2),y3=cy+r2*Math.sin(a2),x4=cx+r2*Math.cos(a),y4=cy+r2*Math.sin(a);
    t+=`<path d="M${x1} ${y1} A${r} ${r} 0 ${large} 1 ${x2} ${y2} L${x3} ${y3} A${r2} ${r2} 0 ${large} 0 ${x4} ${y4} Z" fill="${x.color}"/>`;
    a=a2;});
  const cx=size/2,cy=size/2;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><g>${t}</g><text x="${cx}" y="${cy-4}" text-anchor="middle" fill="#e6edf3" font-size="22" font-weight="700">${fmt(tot)}</text><text x="${cx}" y="${cy+15}" text-anchor="middle" fill="#8b97a7" font-size="11">合计</text></svg>`;
}
 bars(data,h=140,opts={}){ // data:[{label,value,color}]
  const max=Math.max(1,...data.map(d=>+d.value||0)); const w=520, bw=Math.min(56,(w/data.length)-14); let t='';
  data.forEach((d,i)=>{const x=i*(w/data.length)+((w/data.length)-bw)/2; const bh=(+d.value||0)/max*h; const y=h-bh; const c=d.color||COLORS[i%COLORS.length];
    t+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="3" fill="${c}"/>`;
    t+=`<text x="${x+bw/2}" y="${y-4}" text-anchor="middle" fill="#8b97a7" font-size="10">${fmt(d.value)}</text>`;
    if(!opts.noLabels) t+=`<text x="${x+bw/2}" y="${h+12}" text-anchor="middle" fill="#8b97a7" font-size="10">${esc(String(d.label).slice(0,9))}</text>`;});
  return `<svg width="100%" viewBox="0 0 ${w} ${h+20}" preserveAspectRatio="none" style="max-height:${h+24}px">${t}</svg>`;
}
 lineChart(pts,w=540,h=150,color='#3b82f6'){ // pts:[{x,y,label}]
  if(!pts.length) return '<div class="empty">无数据</div>';
  const max=Math.max(1,...pts.map(p=>+p.y||0)); const min=Math.min(0,...pts.map(p=>+p.y||0));
  const X=i=>pts.length>1?i/(pts.length-1)*w:0; const Y=v=>h-((v-min)/(max-min||1))*h;
  let d='', area='', dr='';
  pts.forEach((p,i)=>{const x=X(i),y=Y(p.y); d+=(i?'L':'M')+x+' '+y+' '; if(i===0)area+='M0 '+h+' '; area+='L'+x+' '+y+' '; if(i===pts.length-1)area+='L'+w+' '+h+' Z'; });
  let dots=''; pts.forEach((p,i)=>{ dots+=`<circle cx="${X(i)}" cy="${Y(p.y)}" r="2.5" fill="${color}"/>`; if(p.label&&i%Math.ceil(pts.length/8)===0) dots+=`<text x="${X(i)}" y="${h-5}" text-anchor="middle" fill="#5b6675" font-size="9">${esc(p.label)}</text>`;});
  return `<svg width="100%" viewBox="0 0 ${w} ${h+4}" preserveAspectRatio="none" style="max-height:${h+8}px"><defs><linearGradient id="lg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".35"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="${area}" fill="url(#lg)"/><path d="${d}" fill="none" stroke="${color}" stroke-width="2"/>${dots}</svg>`;
}
 gauge(v,max=100,color='#2ea043'){ const p=Math.max(0,Math.min(1,v/max)); const r=46,c=2*Math.PI*r; const off=c*(1-p);
  return `<svg width="110" height="110" viewBox="0 0 110 110"><circle cx="55" cy="55" r="${r}" fill="none" stroke="#1c2330" stroke-width="10"/><circle cx="55" cy="55" r="${r}" fill="none" stroke="${color}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 55 55)"/><text x="55" y="52" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="700">${Math.round(p*100)}%</text><text x="55" y="69" text-anchor="middle" fill="#8b97a7" font-size="10">${fmt(v)}/${fmt(max)}</text></svg>`;
}
 funnel(stages){ // stages:[{label,value,color}]
  const max=Math.max(1,...stages.map(s=>+s.value||0));
  return stages.map((s,i)=>{const w=Math.max(8,pct(+s.value||0,max)); const c=s.color||COLORS[i%COLORS.length];
    return `<div class="funnel-row"><div class="lab">${esc(s.label)}</div><div class="trk"><i style="width:${w}%;background:${c}"></i></div><div class="num">${fmt(s.value)}</div></div>`;}).join('');
}
 spark(vals,color='#39c5cf'){ if(!vals.length)return''; const max=Math.max(1,...vals),w=80,h=26; const d=vals.map((v,i)=>(i?'L':'M')+(i/(vals.length-1)*w)+' '+(h-v/max*h)).join(' '); return `<svg width="${w}" height="${h}"><path d="${d}" fill="none" stroke="${color}" stroke-width="1.5"/></svg>`; }

  '#scroll [data-i]').forEach(el=>{

 setDrill(rows,fn){ curRows=rows||[]; curDrill=fn; }

/* 单元格级容错：任一字段类型异常只降级该格为「-」，不再让整张表 / 整个面板消失（看板丢失根因） */
 safeCell(c,r){
  let v;
  try{ v = c.f ? c.f(r) : (r==null?undefined:r[c.k]); }
  catch(e){ return '<span class="mut" title="'+esc('渲染失败: '+String(e&&e.message||e))+'">-</span>'; }
  if(v==null) return '';
  if(typeof v==='object') return esc(sumOf(v) || labelOf(v).slice(0,40));
  if(typeof v==='number') return isFinite(v) ? String(v) : '0';
  return String(v);
}
 table(cols,rows){
  const head=cols.map(c=>`<th>${esc(c.t||c)}</th>`).join('');
  const rs=arr(rows);
  const body=rs.map((r,i)=>`<tr class="row" data-i="${i}">`+cols.map(c=>`<td>${safeCell(c,r)}</td>`).join('')+'</tr>').join('');
  return `<table><thead><tr>${head}</tr></thead><tbody>${body||'<tr><td colspan="'+cols.length+'" class="empty">无记录</td></tr>'}</tbody></table>`;
}

/* =====================================================================
   B5 · 时间维度 + 服务端分桶可视化（统一走后端 /api/v14/metrics/timeseries）
   ---------------------------------------------------------------------
   原则（升级方案 §3.4「可视化与时间维度（全站统一）」）：
     · 时间分桶【只在服务端做】。本页此前有两处把 200~300 条原始记录拉到前端、
       再用 (ts||createdAt||'').slice(0,13) 自己分桶 —— 那既不准（UTC 串按 UTC 切，
       与用户认知的「今日」差 8 小时），也不可扩展（记录涨到万级会直接拖死浏览器）。
       现已全部改为服务端聚合，粒度由窗口自动映射：今日→小时 / 本周→日 / 本月→日 / 本年→月。
     · 空桶 = 该时段确实 0 条（真实事实，可以画）；只有 datasetEmpty 才是「无数据」，
       此时渲染「暂无数据」占位，绝不画一条贴地直线冒充趋势。
     · 时间口径按 UTC+8 本地日历、周起点为周一，与服务端内核 v14-timeseries.js 一致。
   ===================================================================== */
 TD(){ return (window.MSCMSChart && MSCMSChart.timeState.get()) || { range:'today', from:'', to:'' }; }
 tdLabel(){ return (window.MSCMSChart && MSCMSChart.timeState.describe()) || '—'; }
/* 统一取数：把全局时间维度注入每次请求。失败返回 {ok:false,error}，绝不回退演示数据。 */
 tsFetch(mod, extra){
  if(!window.MSCMSChart) return Promise.resolve({ ok:false, error:'v14-chart.js 未加载' });
  const s=TD();
  return MSCMSChart.fetchSeries(mod, Object.assign({ range:s.range, from:s.from, to:s.to, timeoutMs:20000 }, extra||{}));
}
/* 当前窗口已取回的数据按 key 缓存，「点图开抽屉」直接复用，不再重复打接口 */
const TSDATA={};
 tsRegister(key, mod, d, req){
  d.__key=key; d.__mod=mod; d.__filter=(req&&req.filter)||null;
  TSDATA[key]=d; return d;
}
/* 同步格式化：把已取回的归一化数据渲染成图表 HTML（含脚注/空占位/错误占位） */
 tsHtml(key, mod, d, opt){
  const o=opt||{};
  if(!window.MSCMSChart) return '<div class="msc-err">图表组件 v14-chart.js 未加载</div>';
  if(!d || !d.ok) return '<div class="msc-err">数据获取失败：'+esc((d&&d.error)||'未知错误')+
    '<div class="tip">接口 /api/v14/metrics/timeseries · 模块 '+esc(mod)+'</div></div>';
  if(MSCMSChart.datasetEmpty(d)){
    return MSCMSChart.noDataHtml('模块 '+mod+' 在此时段内没有可用时间数据'+
      (d.meta&&d.meta.dropped?('（'+d.meta.dropped+' 条记录缺可用时间字段）'):'')) + MSCMSChart.footHtml(d, o.foot);
  }
  const spec=Object.assign({}, o.spec||{});
  const sv=MSCMSChart.seriesValues(d, spec);
  const svg = (spec.type==='bar') ? MSCMSChart.svgBars(sv.vals, d.labels, spec)
                                  : MSCMSChart.svgLine(sv.vals, d.labels, spec);
  return '<div class="ts-host" data-ts-key="'+esc(key)+'" title="点击柱/点查看该时间桶明细">'+svg+'</div>'+
    MSCMSChart.footHtml(d, o.foot);
}
/* 取数 + 格式化一步到位（调用方 await 后直接拼进模板字符串） */
async  tsBody(key, mod, opt){
  const o=opt||{};
  const d=await tsFetch(mod, o.req||{});
  tsRegister(key, mod, d, o.req||{});
  return tsHtml(key, mod, d, o);
}
/* 点图 → 抽屉：任意柱/点都能查到「这个时间桶是什么、怎么复现」 */
 tsBind(root){
  if(!window.MSCMSChart) return;
  (root||document).querySelectorAll('[data-ts-key]').forEach(host=>{
    const key=host.getAttribute('data-ts-key'); const d=TSDATA[key];
    if(!d || !d.ok) return;
    host.onclick=(e)=>{
      const el=(e.target && e.target.closest) ? e.target.closest('[data-msc-i]') : null;
      if(!el) return;
      const i=+el.getAttribute('data-msc-i');
      const dr=MSCMSChart.bucketDrill(d, i); if(!dr) return;
      const q=MSCMSChart.buildQuery(d.__mod, { range:d.range, from:d.from, to:d.to, filter:d.__filter });
      const src = q.error
        ? '<div class="tip" style="color:var(--yel)">下钻查询串不可用：'+esc(q.error)+'</div>'
        : '<div class="section-h" style="">该窗口的聚合接口</div><pre class="raw">'+esc(q.url)+'</pre>'+
          '<div class="tip">把上面的 URL 直接打开即可核对本图每一个数字的来源</div>';
      openDrill(dr.title+' · '+d.__mod,
        '<div class="section-h">时间桶明细 <span class="lvl">L5</span></div>'+ kvTable(dr.kv) +
        '<div class="section-h" style="">本图口径</div>'+
        kvTable({ 模块:d.__mod, 时间维度:tdLabel(), 窗口起:d.from||'—', 窗口止:d.to||'—',
                  数据源:'GET /api/v14/metrics/timeseries', 窗口内条数:d.total,
                  模块记录总数:d.records, 当前页过滤:d.__filter?JSON.stringify(d.__filter):'无' }) +
        src, dr.raw);
    };
  });
}
/* 列表「迷你趋势列」——按模块批量取（一次请求最多 8 个模块，服务端聚合）。
   仅适用于「行 = 数据模块」的列表（如全模块数据量 TOP N）。 */
async  tsTrendByModules(rows){
  const blank={ val:()=>'<span class="msc-tdim">—</span>', note:'' };
  if(!window.MSCMSChart || !rows.length) return blank;
  const names=rows.map(r=>r.module).filter(Boolean);
  const got={};
  for(let i=0;i<names.length;i+=8){
    const batch=names.slice(i,i+8);
    const r=await MSCMSChart.fetchSeriesMulti(batch, { range:TD().range, from:TD().from, to:TD().to });
    if(r.ok) batch.forEach(m=>{ got[m]=r.byModule[m]; });
  }
  return {
    val:(i)=>{
      const m=rows[i] && rows[i].module; const d=got[m];
      if(!d) return '<span class="msc-tdim" title="未取到该模块的时间序列">—</span>';
      if(!d.ok) return '<span class="msc-tdim" title="'+esc(d.error)+'">—</span>';
      if(MSCMSChart.datasetEmpty(d)) return '<span class="msc-tdim" title="该模块在此时段内无可用时间数据">—</span>';
      const sv=MSCMSChart.seriesValues(d,{});
      return MSCMSChart.trendCell(sv.vals, { title:m+' · '+tdLabel()+' · '+MSCMSChart.describeMeta(d.meta) });
    },
    note:'迷你趋势列按当前时间维度（'+tdLabel()+'）由服务端分桶聚合，一次请求覆盖 8 个模块',
  };
}
/* 列表「迷你趋势列」——按实体过滤取（每行一次服务端聚合）。
   请求数 = 展开行数，故默认只展开前 N 行；其余行如实显示「—」并在表脚说明，
   绝不为了「每行都有图」而复制同一条曲线或凭空造数。 */
async  tsTrendByField(mod, rows, field, opt){
  const o=opt||{}; const cap=o.cap||5;
  const blank={ val:()=>'<span class="msc-tdim">—</span>', note:'' };
  if(!window.MSCMSChart || !rows.length) return blank;
  const head=rows.slice(0, cap);
  const got=await Promise.all(head.map(r=>{
    const v=r[field];
    if(v===undefined||v===null||v==='') return Promise.resolve({ ok:false, error:'该行 '+field+' 为空，无法按实体聚合' });
    return tsFetch(mod, { filter:field+':'+v });
  }));
  return {
    val:(i)=>{
      const r=rows[i]; const d=got[i];
      if(!r || !d) return '<span class="msc-tdim" title="迷你趋势列仅展开前 '+cap+' 行（每行一次服务端聚合，避免 N 次全量扫描）">—</span>';
      if(!d.ok) return '<span class="msc-tdim" title="'+esc(d.error)+'">—</span>';
      if(MSCMSChart.datasetEmpty(d)) return '<span class="msc-tdim" title="该 '+field+' 在此时段内无可用时间数据">—</span>';
      const sv=MSCMSChart.seriesValues(d,{});
      return MSCMSChart.trendCell(sv.vals, { title:String(r[field])+' · '+tdLabel()+' · '+MSCMSChart.describeMeta(d.meta) });
    },
    note:'迷你趋势列 = 该行按 '+field+' 过滤后的真实时间序列（'+tdLabel()+'）；本表展开前 '+Math.min(cap,rows.length)+'/'+rows.length+' 行',
  };
}

async  renderAcctClosedLoop(){
  const [content,publish]=await Promise.all([API('/api/v14/data/content?limit=600'),API('/api/v14/data/publish?limit=600')]);
  const cs=arr(content.items); const ps=arr(publish.items);
  // build content lookup by id (content 无 account_id，走内容池；publish 携带 account_id + content_id)
  const cById={}; cs.forEach(c=>{ if(c.id)cById[c.id]=c; });
  // aggregate by real account (publish 侧携带真实账号)
  const byAcc={};
  ps.forEach(p=>{ const a=p.account_id; if(!a)return;
    byAcc[a]=byAcc[a]||{account:a,:p.||'-',published:0,linked:0,reach:0,items:[]};
    byAcc[a].published++;
    byAcc[a].reach+=(+p.reach||0);
    if(p.content_id&&cById[p.content_id]) byAcc[a].linked++;
    byAcc[a].items.push(p);
  });
  const rows=Object.values(byAcc).map(r=>({...r,rate:r.published?Math.round(r.linked/r.published*100):0,
    consistency:r.linked===r.published&&r.published>0?'完全闭环':(r.linked>0?'部分闭环':'待关联')}));
  rows.sort((a,b)=>b.published-a.published);
  const consistent=rows.filter(r=>r.consistency==='完全闭环';
  const totalPub=rows.reduce((s,r)=>s+r.published,0);
  const totalLinked=rows.reduce((s,r)=>s+r.linked,0);
  setDrill(rows,(r)=>openDrill('L5 · 闭环账号 '+r.account,

    (arr(r.items?table([{t:'内容ID',k:'content_id',f:x=>esc(str(x.content_id||'-').slice(0,32))},{t:'时间',k:'published_at',f:x=>esc((x.published_at||'').replace('T',' ').slice(0,19))},{t:'触达',k:'reach'}],r.items.slice(0,8)):'<div class="empty">无</div>')+
    '<div class="tip">每条发布均绑定真实账号 + 内容ID → 需求①闭环一致性</div>',r));
  return `
  <div class="grid g4">
    ${kpiCard(rows.length,'参与闭环账号','','均绑定真实账号发布')}
    ${kpiCard(consistent,'完全闭环','up',pct(consistent,rows.length)+'%')}
    ${kpiCard(totalPub,'累计发布','up',cs.length+' 条内容可用')}

  </div>
  <div class="panel" style=""><h3>账号 → 发布 / 内容关联 一致性矩阵 (点击查看 L5)</h3>${table([{t:'账号',k:'account',f:r=>esc(r.account)+' <span style="color:var(--mut);font-size:10px">'+esc(r.)+'</span>'},{t:'发布',k:'published'},{t:'关联内容',k:'linked'},{t:'触达',k:'reach',f:r=>fmt(r.reach)},{t:'闭环率',k:'rate',f:r=>'<div class="minibar"><i style="width:'+r.rate+'%;background:'+(r.consistency==='完全闭环'?'var(--grn)':'var(--yel)')+'"></i></div> '+r.rate+'%'},{t:'状态',k:'consistency',f:r=>r.consistency==='完全闭环'?'<span class="pill p-on">完全闭环</span>':'<span class="pill p-warn">'+r.consistency+'</span>'}],rows.slice(0,40))}<div class="tip">发布携带真实 account_id + content_id，与内容池双向关联，验证需求①闭环</div></div>`;

const APIP=(p,b)=>fetch(p,{method:'POST''':'application/json','Accept':'application/json'},body:JSON.stringify(b||{})}).then(r=>r.json().catch(()=>({ok:false,error:'HTTP '+r.status}))).catch(e=>({ok:false,error:String(e.message||e)}));

 exitOps(r){ const n=String(r.name||'').replace(/'/g,""); return '<button class="btn" onclick="exitSet(\''+n+'\',\'scrape\')">抓取</button> <button class="btn" onclick="exitSet(\''+n+'\',\'post\')">发布</button> <button class="btn" onclick="exitSet(\''+n+'\',\'off\')">停用</button> <button class="btn" onclick="exitTest(\''+n+'\')">体检</button>'; }
 exitLastCheck(r){ const c=r.lastCheck; if(!c) return (r&&r.note)?String(r.note).slice(0,40):'未体检'; return String(c.at||'').slice(11,16)+' 实测'+(c.realIp||'-')+' · Tumblr '+(c.tumblr||'-'); }

 normType(t){ if(t==='video'||t==='text_video')return 'video'; if(t==='image_text'||t==='text_image')return 'image_text'; return 'text'; }
 typeBadge(t){const n=normType(t);const m={video:['tb-video','🎬 短视频'],image_text:['tb-image_text','🖼️ 图文'],text:['tb-text','📄 文本']};const v=m[n]||m.text;return `<span class="type-badge ${v[0]}">${v[1]}</span>`;}
let CE={type:'video',images:[]};
 ceAttr(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
 ceMsg(t,ok){const e=document.getElementById('ce-status-msg'); if(!e)return; e.style.color=ok?'var(--grn)':'var(--red)'; e.textContent=t;}
async  CEPost(path,body){const r=await fetch(path,{method:'POST''':'application/json','Accept':'application/json'},body:JSON.stringify(body)}); const j=await r.json().catch(()=>({error:'HTTP '+r.status})); if(!r.ok) throw new Error(j.error||('HTTP '+r.status)); return j;}

 ceBuildPreview(){ return '<div class="ce-lib-thumb" style="height:200px"><div class="ph">在左侧编辑内容，预览将实时显示于此</div></div>'; }
 ceBuildPreviewItem(c){
  const type=normType(c.content_type||'text');
  let h=`<div class="section-h">内容预览 <span class="lvl">L5</span></div>`;
  if(type==='video'){
    if(c.video_url) h+=`<video class="ce-prev-video" controls preload="metadata" src="${ceAttr(c.video_url)}"></video>`;
    else if(c.cover_url) h+=`<img class="ce-prev-video" src="${ceAttr(c.cover_url)}" onerror="this.style.display='none'">`;
    h+=`<div class="ce-prev-meta">短视频 · 时长 ${ceAttr(c.duration!=null?c.duration:'-')}s · 平台 ${ceAttr(c.||'-')}</div>`;
  } else if(type==='image_text'){
    const imgs=Array.isArray(c.images)?c.images:[];
    h+=`<div class="ce-prev-thumbs">`+(imgs.length?imgs.map(u=>`<img src="${ceAttr(u)}" onerror="this.style.display='none'">`).join(''):'<div class="ph">无图片</div>')+`</div>`;
  } else {

  }
  h+=`<div class="ce-prev-cap">${ceAttr((c.title?('【'+c.title+'】\n'):'')+(c.body||'(无正文)'))}</div>`;
  return h;
}

async  renderAnalCompass(){
  const [ov,cc,dev,acc]=await Promise.all([API('/api/v14/data/overview'),API('/api/v14/causal-chain/status'),loadDevices(),API('/api/v14/')]);
  const sum=ov.summary||{};
  /* 【B5 修正·存量 bug】分模块统计在响应的【顶层 moduleStats】，summary 里只有
     {totalModules,totalRecords,modules} 三个字段，没有 summary.moduleStats。
     原写法 sum.moduleStats 恒为 undefined → 「全模块数据量 TOP 12」表体一直是空的、
     「发布记录」KPI 恒为 0（实测 publish 有 4876 条却显示 0）。此处改为顶层取值并保留旧路径兜底。 */
  const ms=ov.moduleStats||sum.moduleStats||{};
  const core=ov.coreStats||{};
  // all 28 modules
  const modAll=Object.entries(ms).map(([k,v])=>({module:k,records:(v&&v.totalRecords)||0,lastModified:(v&&v.lastModified)||null}))
    .sort((a,b)=>b.records-a.records);
  const modRows=modAll.slice(0,12);
  // 【B5】迷你趋势列：一次请求最多覆盖 8 个模块，12 个模块只需 2 次；每行都是该模块真实的时间序列
  const modTrend=await tsTrendByModules(modRows);
  modRows.forEach((r,i)=>{ r.__trend=modTrend.val(i); });
  const totalRec=sum.totalRecords||0;
  // closed-loop phases
  const gate=cc.chainGate||{}; let phases=gate.phases;
  if(!Array.isArray(phases)){ const names=['account.ed','account.healthy','content.generated','post.published','visit.recorded','dau.updated','action.execute'];
    phases=names.map(n=>({name:n,current:0,target:1,status:'idle',progress:0,remaining:1})); }
  const completedPhases=phases.filter(p=>p.status==='completed';
  const runningPhase=phases.find(p=>p.status==='running');
  const nextPhase=phases.find(p=>p.status==='idle')||phases[phases.length-1];
  const devS=core.devices||(dev.stats||{});
  const accS=core.nurturing||{};
  const cg=core.contentGenerator||{};
  setDrill(phases,(p)=>openDrill('L5 · 阶段 '+p.label,
    `<div class="section-h">阶段详情 <span class="lvl">L5</span></div>`+
    kvTable({阶段名:p.name,中文名:p.label,顺序:p.order,目标:p.target,当前:p.current,进度:p.progress+'%',
      剩余:p.remaining,状态:p.status,下游:p.next||'-',
      开始:p.startedAt?(p.startedAt.replace('T',' ').slice(0,19)):'-',
      完成:p.completedAt?(p.completedAt.replace('T',' ').slice(0,19)):'-',
      元数据:JSON.stringify(p.metadata||{})})+
    `<div class="tip">${p.status==='completed'?'已完成':p.status==='running'?'进行中 · 达到目标后可自动推进':'等待前序完成后激活'}</div>`,p));
  return `
  <div class="grid g4">
    ${kpiCard(sum.totalModules||0,'数据模块','',totalRec+' 条记录')}
    ${kpiCard((devS.online||devS.total||0)+'/'+(devS.total||devS.online||0),'云手机在线','up',(devS.total||0)+' 台 '+(devS.mode||''))}
    ${kpiCard((arr(acc.)||(accS.total||0),'真实账号','up',(accS.avgHealthScore||0)+' 平均分')}
    ${kpiCard((ms.publish&&ms.publish.totalRecords)||0,'发布记录','up',(cg.totalGenerated||0)+' 已生成')}
  </div>
  <div class="grid g2" style="">
    <div class="panel"><h3>7 阶段因果链闭环进度 (L4 · 实时)</h3>
      ${phases.map(p=>{const pcol=p.status==='completed'?'var(--grn)':p.status==='running'?'var(--yel)':'var(--bord)';
        const stxt=p.status==='completed'?'✓ 完成':p.status==='running'?'● 进行中':'○ 待激活';
        return `<div style="margin:9px 0;cursor:pointer" data-ph="${p.order}">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
            <span style="width:14px;color:${pcol};font-size:12px">${p.status==='completed'?'✓':p.status==='running'?'●':'○'}</span>
            <span style="flex:1;font-size:12.5px">${esc(p.label)} <span class="mut" style="color:var(--mut);font-size:10px">${esc(p.name)}</span></span>
            <span style="font-size:11px;color:${pcol}">${p.current}/${p.target}</span>
          </div>
          <div class="bar" style="height:9px"><i style="width:${p.progress}%;background:${pcol}"></i></div>
          <div style="font-size:10px;color:var(--mut);margin-top:2px">${stxt} · ${p.progress}%${p.remaining>0?' · 剩余 '+p.remaining:''}</div>
        </div>`;}).join('')}
      <div class="tip">已完成 ${completedPhases}/7 阶段 ${runningPhase?('· 当前推进: '+esc(runningPhase.label)):''} ${nextPhase&&runningPhase?'· 下一阶段: '+esc(nextPhase.label):''}</div>
    </div>
    <div class="panel"><h3>全模块数据量 TOP 12 (L4 · 共 ${sum.totalModules||0} 模块)</h3>
      ${table([{t:'模块',k:'module',f:r=>esc(r.module)},{t:'记录数',k:'records',f:r=>'<div class="minibar"><i style="width:'+Math.min(100,Math.round(r.records/(modRows[0].records||1)*100))+'%;background:'+(r.records>500?'var(--grn)':r.records>50?'var(--yel)':'var(--mut2)')+'"></i></div> '+fmt(r.records)},{t:'趋势',k:'__trend',f:r=>r.__trend},{t:'最近写入',k:'lastModified',f:r=>r.lastModified?(esc((r.lastModified+'').replace('T',' ').slice(0,19))):'<span style="color:var(--mut2)">—</span>'}],modRows)}
      <div class="tip">全链路贯通：内容 → 发布 → 访问 → 流量 → 转化。点击阶段条查看 L5 详情</div>
      <div class="tip">${esc(modTrend.note)}</div>
    </div>
  </div>`;
}

/* ---------- shared KPI card ---------- */
/* KPI 值收敛：对象 → 摘要/标签，NaN/Infinity → 0，避免 [object Object] / NaN 占位整卡 */
 kpiVal(v){
  if(v==null) return '0';
  if(typeof v==='object'){ const s=sumOf(v); return esc(s ? String(s).slice(0,22) : labelOf(v).slice(0,22)); }
  if(typeof v==='number') return isFinite(v) ? String(v) : '0';
  return esc(String(v).slice(0,40));
}
 kpiCard(v,label,cls,desc){ const c=cls==='up'?'up':cls==='down'?'down':''; const col=cls==='down'?'var(--red)':cls==='up'?'var(--grn)':'var(--txt)';
  const d = desc==null ? '' : (typeof desc==='object' ? (sumOf(desc)||labelOf(desc)) : String(desc));
  return `<div class="panel"><div class="kpi"><div class="v" style="color:${col}">${kpiVal(v)}</div><div class="l">${esc(label)}</div>${d?`<div class="d ${c}">${esc(String(d).slice(0,60))}</div>`:''}</div></div>`; }

async  aiChatAsk(){

  out.innerHTML+='<div class="ai-q">❓ '+esc(q)+'</div>';
  inp.value=''; inp.disabled=true;

    const ans=(r&&(r.answer||r.reply||r.text))||JSON.stringify(r);
    const el=document.getElementById('ai-stream'); if(el)el.innerHTML='💡 '+(typeof ans==='string'?esc(ans):esc(JSON.stringify(ans,null,2)));
  }catch(e){ const el=document.getElementById('ai-stream'); if(el)el.textContent='⚠️ '+e.message; }
  finally{ inp.disabled=false; inp.focus(); }
}

}

 tsCard(t){
  const tags = (arr(t.tags)).map(x=>`<span class="chip">${esc(x)}</span>`).join(' ');
  const arts = (arr(t.articles)).slice(0,3).map(a=>`<li><a href="${ceAttr(a.url||'#')}" target="_blank" rel="noopener">${esc(a.title||'')}</a></li>`).join('');
  const geo = esc(t.geo||'US');
  return `<div class="ts-card" id="tsc-${esc(t.id)}">
    <div class="ts-h"><b>${esc(t.keyword||t.title||'')}</b> <span class="mut">· ${geo} · 热度 ${esc(t.traffic||'-')}</span></div>
    <div class="ts-tags">${tags}</div>
    ${arts?`<ul class="ts-arts">${arts}</ul>`:''}
    <div class="ts-actions">
      <button class="ai-btn" onclick="tsGenRender('${esc(t.id)}')">🎬 生成脚本并渲染视频</button>
    </div>
    <div class="ts-res" id="tsr-${esc(t.id)}"></div>
  </div>`;
}

async  tsRefresh(){

async  tsGenRender(trendId){
  const resBox=document.getElementById('tsr-'+trendId); if(!resBox)return;
  resBox.innerHTML='<div class="mut">⏳ 生成脚本…</div>';
  try{
    const tr=await API('/api/v14/trending/intel/'+encodeURIComponent(trendId)); if(tr.__err__) throw new Error(tr.__err__);
    const sc=await CEPost('/api/v14/trending/intel/'+encodeURIComponent(trendId)+'/script',{duration:8});
    const created=await CEPost('/api/v14/content',{
      content_type:'text_video', title:tr.keyword||tr.title, body:tr.keyword||tr.title,
      :'tumblr', tags:sc.tags||arr(tr.tags), duration:8, status:'editing'
    });
    const cid=created.record&&created.record.id; if(!cid) throw new Error('内容创建失败');
    resBox.innerHTML='<div class="mut">⏳ ffmpeg 渲染视频中…</div>';
    const vr=await CEPost('/api/v14/content/'+encodeURIComponent(cid)+'/render',{
      lines:sc.lines||[tr.keyword||'今日热点'], tags:sc.tags||arr(tr.tags), duration:8
    });
    const vu=vr.render&&vr.render.videoUrl;
    TS_STATE.renders[cid]={videoUrl:vu, filePath:vr.render&&vr.render.filePath, trendId};
    resBox.innerHTML=`<div class="ts-video"><video src="${ceAttr(vu||'')}" controls muted playsinline style="max-;border-radius:8px;background:#000"></video></div>
      <div class="ts-line">✅ 已渲染 ${esc(String((vr.render&&vr.render.duration)||8))}s · ${((vr.render&&vr.render.size)||0)/1024|0}KB · 内容ID ${esc(cid)}</div>
      <button class="prim" onclick="tsPublish('${esc(cid)}')">📤 发布到 Tumblr</button>`;
  }catch(e){
    resBox.innerHTML='<div class="ce-err">❌ '+esc(e.message)+'</div>';
  }
}

async  tsPublish(contentId){
  const resBox=document.getElementById('tsr-'+contentId); if(!resBox)return;
  const meta=TS_STATE.renders[contentId]||{};
  resBox.insertAdjacentHTML('beforeend','<div class="mut">⏳ 发布到 Tumblr…</div>');
  try{
    const r=await CEPost('/api/v14/tumblr/publish',{videoId:contentId});
    if(r.ok){
      TS_STATE.publish[contentId]=r.postUrl;
      resBox.insertAdjacentHTML('beforeend',`<div class="ts-pub">✅ 真实发布成功！<a href="${ceAttr(r.postUrl)}" target="_blank" rel="noopener">${esc(r.postUrl)}</a></div>`);
    } else throw new Error(r.error||'发布失败');
  }catch(e){
    resBox.insertAdjacentHTML('beforeend',`<div class="ce-err">⚠️ ${esc(e.message)}（若未授权将生成本地预览链接，完成 OAuth 后重试即可）</div>`);
  }
}

 statusBadge(s){ const m={published:['ok','已发布'],scheduled:['yel','待调度'],draft:['mut','草稿'],failed:['err','失败'],trash:['mut','回收']}; const x=m[s]||['mut',s]; return `<span class="chip ${x[0]==='ok'?'ok':x[0]==='err'?'ce-err':''}">${x[1]}</span>`; }

 mpParseAccounts(raw){
  const out=[];
  (raw||'').split(/[\n\s]+/).map(s=>s.trim()).filter(Boolean).forEach(line=>{
    const i=line.indexOf(':');
    if(i>0){ out.push({:line.slice(0,i).trim(), id:line.slice(i+1).trim()}); }
    else { out.push({:line, id:'default'}); }
  });
  return out;
}
async  mpCreatePost(){
  const box=document.getElementById('mp-createres');
  const text=document.getElementById('mp-text').value.trim();
  const =mpParseAccounts(document.getElementById('mp-').value);
  if(!text){box.textContent='请填文案';return;}
  if(!.length){box.textContent='请至少填一个 :accountId';return;}
  const media=[];
  const vid=document.getElementById('mp-video').value.trim();
  if(vid){
    try{ const list=await API('/api/v14/video-render/list'); const rec=(arr(list.items)).find(x=>x.id===vid); if(rec&&rec.filePath) media.push({type:'video',filePath:rec.filePath,renderId:vid}); }
    catch(e){}
  }
  const t=document.getElementById('mp-time').value;
  const tagIds=(document.getElementById('mp-tags').value||'').split(',').map(s=>s.trim()).filter(Boolean);
  box.textContent='创建中…';
  try{
    const r=await CEPost('/api/v14/mixpost/posts',{text,,media,scheduledAt:t||null,tagIds});
    box.textContent='✅ 已创建（'+r.post.status+'），可点「发布」';
    await renderCurrent();
  }catch(e){ box.textContent='⚠️ '+e.message; }
}

  box.textContent='本地生成密钥中…（绝不上报私钥）';
  try{
    const r=await CEPost('/api/v14/mixpost/provider/nostr/generate',{});
    if(r.ok){
      document.getElementById('ns-priv').value=r.Hex;
      box.innerHTML='🔑 已生成并本地保存！<br><b>npub:</b> '+esc(r.npub)+'<br><b>nsec（请立即备份，仅显示一次）：</b> <code style="word-break:break-all">'+esc(r.nsec)+'</code>';
      await mpNostrLoad();
    } else box.textContent='⚠️ '+JSON.stringify(r);
  }catch(e){ box.textContent='⚠️ '+e.message; }
}
async  mpNostrSave(){
  const box=document.getElementById('ns-res'); const priv=document.getElementById('ns-priv').value.trim();
  const relays=document.getElementById('ns-relays').value.trim();
  if(!priv){ box.textContent='⚠️ 私钥必填（先点「生成新密钥」，或粘贴已有 nsec/hex）'; return; }
  box.textContent='保存中…';
  try{
    const r=await CEPost('/api/v14/mixpost/provider/nostr/config',{:priv,relays});
    if(r.ok){ box.textContent='✅ 已保存：Nostr 现在可真实去中心化发布（零账号/零第三方）'; await mpNostrLoad(); }
    else box.textContent='⚠️ '+JSON.stringify(r);
  }catch(e){ box.textContent='⚠️ '+e.message; }
}
async  mpNostrLoad(){
  const el=document.getElementById('ns-status'); if(!el)return;
  try{
    const c=await API('/api/v14/mixpost/provider/nostr/config');
    el.innerHTML = c.configured
      ? '✅ 已配置（npub='+esc((c.npub||'').slice(0,16))+'…）— 可真实去中心化发布'
      : '⚪ 未配置 — 点击「生成新密钥」即可在本地创建身份（零账号）';
  }catch(e){ el.textContent='状态获取失败：'+e.message; }
}
async  mpNostrTest(){
  const box=document.getElementById('ns-res');
  box.textContent='正在签名并广播测试帖子到 Nostr 中继…';
  try{
    const r=await CEPost('/api/v14/mixpost/provider/nostr/test-publish',{});
    if(r.ok&&r.status==='published'){ box.innerHTML='✅ 真实发布成功！查看链接：<a href="'+esc(r.url)+'" target="_blank" style="">'+esc(r.url)+'</a>'; await mpNostrLoad(); }
    else box.textContent='⚠️ 发布未成功：'+(r.error||JSON.stringify(r));
  }catch(e){ box.textContent='⚠️ '+e.message; }
}

async  mpGithubSave(){
  const box=document.getElementById('gh-res');
  const tok=document.getElementById('gh-tok').value.trim();
  if(!tok){ box.textContent='⚠️ 请先粘贴 GitHub PAT'; return; }
  const target=document.getElementById('gh-target').value.trim()||'gist';
  const repo=document.getElementById('gh-repo').value.trim()||'';
  box.textContent='正在保存 GitHub 凭证…';
  try{
    const r=await CEPost('',{token:tok,target,repo});
    if(r.ok){ box.textContent='✅ 已保存：GitHub 现在可真实免费发布（Gist/仓库）'; await mpGithubLoad(); }
    else box.textContent='⚠️ 保存失败：'+(r.error||JSON.stringify(r));
  }catch(e){ box.textContent='⚠️ '+e.message; }
}

}

/* 【B5】用户要求：取消定时自动刷新（原 5s / 15s / 1m / 10m 分段），只保留手动「刷新」按钮。
   理由：50 并发下高频轮询会持续打爆后端聚合，而本页数据以「按需查看」为主。
   真正的秒级实时仍在 /v14-live.html（独立页 SSE 推送，不占本页资源）。
   现状：本页【已不存在任何轮询业务数据的 setInterval】，状态文案固定为「手动」。 */
 setRefreshMode(){
  const dot=$('#livedot'), txt=$('#livetxt');
  if(!dot||!txt) return;
  dot.className='dot off';
  txt.textContent='手动';
  txt.title='本页仅支持手动刷新（点右上「刷新」）；秒级实时请点「实时页」打开 /v14-live.html（SSE 推送）';
}
/* 【B5】保留 setLive 仅为兼容潜在旧调用点：本页已无「实时/轮询」态可切换，统一显示「手动」。 */
 setLive(){ setRefreshMode(); }
async  updateBadges(){
  try{
    const [dev,acc,cc,mkt,ov]=await Promise.all([
      loadDevices(),
      API('/api/v14/'),
      API('/api/v14/causal-chain/status'),
      API('/api/v14/marketing/stats').catch(()=>({})),
      API('/api/v14/data/overview').catch(()=>({})),
    ]);
    const st=dev.stats||{}; devCount=(st.online||0)+'/'+(st.total||0);
    acctCount=(arr(acc.);
    chainCount=(cc.stats&&cc.stats.totalHandled)||0;
    mktCount=(mkt&&mkt.totalCampaigns!=null)?((mkt.activeCampaigns||0)+'/'+mkt.totalCampaigns):'';
    const ms=ov.moduleStats||{}; const rec=k=>((ms[k]&&ms[k].totalRecords)||0);
    contentCount=rec('content');
    linkCount=rec('link_traffic');
    convCount=rec('conversion_logs');
    const map={ov:chainCount,acct:acctCount,content:contentCount,traffic:linkCount,conv:convCount,mkt:mktCount,sysops:devCount,ai:''};
    MENUS.forEach(m=>{ const b=$('#bad-'+m.id); if(b) b.textContent=map[m.id]!=null&&map[m.id]!==''?map[m.id]:'·'; });
  }catch(e){}
}
/* 【B5】startTimer 已停用：本页不再创建任何定时器。
   保留同名函数只为兼容历史调用点，避免 ReferenceError；它只做「清理」，不建立 interval。 */
 startTimer(){ if(state.timer){ clearInterval(state.timer); state.timer=null; } }
/* 【B5】全局时间维度控件：今日 | 本周 | 本月 | 本年 | 自定义。
   所有图表/列表共享同一维度（§3.4「全站统一」），选择结果持久化到 localStorage。
   切换维度只做一件事：用新窗口重新渲染当前页 —— 不做任何局部缓存复用，
   因为图表/表格里的全部数字都随窗口变化，复用旧数据必然出现「标签变了数字没变」的失真。
   自定义窗口非法（起始 >= 结束）时控件内部报错且【不写入状态】，绝不静默改写窗口。 */
((){
  const host=$('#tdhost');
  if(!host || !window.MSCMSChart){
    if(host) host.innerHTML='<span class="st" style="color:var(--yel)" title="v14-chart.js 未加载，时间维度不可用">时间维度不可用</span>';
    return;
  }
  MSCMSChart.mountControl(host, {
    onChange:()=>{ if(CURRENT.menu) renderCurrent(); else updateBadges(); },
  });
})();
/* 手动刷新按钮 —— 本页唯一的刷新入口 */
$('#refreshbtn').onclick=async()=>{ await updateBadges(); if(CURRENT.menu)await renderCurrent(); };
/* 实时页入口（独立页，非本页刷新频率） */
$('#livebtn') && ($('#livebtn').onclick=()=>window.open('/v14-live.html','_blank','noopener'));

buildSide();
selectMenu('acct');
// 支持 #菜单/Tab 直达（如 #acct/exits 直接打开「出口调度」面板）
((){ const h=(location.hash||'').replace(/^#/,''); if(!h) return; const p=h.split('/'); const m=MENUS.find(x=>x.id===p[0]); if(!m) return; const t=m.tabs.find(x=>x.id===p[1])||m.tabs[0]; gotoPage(m.id,t.id); })();
updateBadges();
/* 【B5】已取消 ?refresh=<秒> 自动刷新参数：本页固定「手动刷新」，传入该参数不再生效。
   需要自动/实时能力请用 /v14-live.html（SSE 推送，仅数据变化时下发）。 */
state.refresh=0;
setRefreshMode();
</script>
