# ═══════════════════════════════════════════════════════════════
#  nginx-win.conf — Windows 本地开发版 Nginx 配置
#  路径适配为 Windows 绝对路径
# ═══════════════════════════════════════════════════════════════

worker_processes  auto;
worker_rlimit_nofile  65535;

events {
    worker_connections  4096;
    use  select;                          # Windows 不支持 epoll
    multi_accept  on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size  2048;
    server_tokens   off;

    # ── 日志 ──
    log_format  cloaking  '$remote_addr - $http_host [$time_local] '
                          '"$request" $status $body_bytes_sent '
                          '"$http_user_agent" "$http_x_forwarded_for" '
                          'upstream=$upstream_addr rt=$request_time';

    access_log  logs/access.log  cloaking;
    error_log   logs/error.log   warn;

    gzip  on;
    gzip_vary  on;
    gzip_min_length  1024;
    gzip_types  text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # ── Upstream ──
    upstream express_backend {
        server :3000  max_fails=3  fail_timeout=30s;
        keepalive  32;
        keepalive_requests  1000;
        keepalive_timeout  60s;
    }

    # ══════════════════════════════════════════════════════════
    #  HTTP (80) — 多壳域名群控前置
    # ══════════════════════════════════════════════════════════
    server {
        listen       80;
        listen       [::]:80;
        # DD.txt: 批量绑定群控发帖引流域名
        # 生产环境替换：server_name *.gate01.xyz *.gate02.top *.gate03.link;
        server_name  _;

        # ★ error_page 在 server 级别定义
        error_page  502 503 504  = @fallback;

        # 健康检查
        location = /health-check {
            access_log off;
            return 200 "nginx-ok\n";
            add_header  text/plain;
        }

        # ── DD.txt 对齐：/route 和 /gateway → 智能 Cloaking 代理 ──
        location /route {
            include proxy-headers.conf;
            proxy_pass  http://express_backend;
            proxy_connect_timeout  5s;
            proxy_send_timeout     30s;
            proxy_read_timeout     30s;
        }

        location /gateway {
            include proxy-headers.conf;
            proxy_pass  http://express_backend;
            proxy_connect_timeout  5s;
            proxy_send_timeout     30s;
            proxy_read_timeout     30s;
        }

        # ── Postback API 直通（不允许缓存） ──
        location /api/ {
            include proxy-headers.conf;
            proxy_pass  http://express_backend;
            proxy_connect_timeout  5s;
            proxy_read_timeout     15s;
        }

        # ── 控制台 /console → Express 直通 ──
        location /console {
            include proxy-headers.conf;
            proxy_pass  http://express_backend;
            proxy_connect_timeout  5s;
            proxy_read_timeout     30s;
        }

        # ── 控制台静态资源 ──
        location /console.html {
            include proxy-headers.conf;
            proxy_pass  http://express_backend;
            proxy_connect_timeout  5s;
            proxy_read_timeout     30s;
        }

        # ── 其他所有路径 → 策略选择 ──
        # 选项 A：返回 403 隐藏后端（安全）
        # 选项 B：返回白页（伪装合规内容站）
        location / {
            root   C:/Users/AS/WorkBuddy/2026-06-13-19-42-19/nginx-runtime/nginx-1.26.2/fallback-white-site;
            index  index.html;
            try_files  $uri  $uri/  /index.html;
            expires  1h;
            add_header    "public, max-age=3600";
        }

        # @fallback：后端宕机时展示静态白页（绝对路径）
        location @fallback {
            root   C:/Users/AS/WorkBuddy/2026-06-13-19-42-19/nginx-runtime/nginx-1.26.2/fallback-white-site;
            index  index.html;
            try_files  $uri  $uri/  /index.html;
            expires  1h;
            add_header    "public, max-age=3600";
            access_log  logs/fallback.log  cloaking;
        }

        # Nginx 状态页（仅本机）
        location /nginx-status {
            stub_status  on;
            access_log   off;
            allow  ;
            allow  ::1;
            deny   all;
        }
    }
}
