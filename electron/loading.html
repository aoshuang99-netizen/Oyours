<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSCMS v14 - 启动中...</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(135deg, #0a1628 0%, #0f2137 50%, #0a1628 100%);
    color: #e0e6ed;
    display: flex; align-items: center; justify-content: center;
    height: 100vh; overflow: hidden;
  }
  .container { text-align: center; }
  .logo {
    width: 96px; height: 96px;
    background: linear-gradient(135deg, #00d4ff 0%, #0066ff 100%);
    border-radius: 24px;
    margin: 0 auto 24px;
    display: flex; align-items: center; justify-content: center;
    font-size: 40px; font-weight: 900; color: #fff;
    box-shadow: 0 8px 32px rgba(0, 132, 255, 0.3);
  }
  h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
  .subtitle { font-size: 14px; color: #6b8299; margin-bottom: 40px; }
  .spinner {
    width: 48px; height: 48px;
    border: 3px solid rgba(0, 132, 255, 0.2);
    border-top-color: #00d4ff;
    border-radius: 50%;
    margin: 0 auto 24px;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status { font-size: 14px; color: #6b8299; }
  .status span { color: #00d4ff; }
  .progress-bar {
    width: 240px; height: 3px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
    margin: 16px auto 0;
    overflow: hidden;
  }
  .progress-bar .fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #00d4ff, #0066ff);
    border-radius: 2px;
    transition: width 0.5s ease;
  }
  .version { font-size: 11px; color: #3d5567; margin-top: 48px; }
</style>
</head>
<body>
  <div class="container">
    <div class="logo">M</div>
    <h1>MSCMS v14.2</h1>
    <p class="subtitle">全链路因果闭环 · 引流转化修复</p>
    <div class="spinner"></div>
    <p class="status">正在启动 <span id="step">引擎核心</span>...</p>
    <div class="progress-bar"><div class="fill" id="progress"></div></div>
    <p class="version">v14.2 Desktop · 2026-07-08</p>
  </div>
  <script>
    const steps = [
      { text: '检测 Node.js 环境', pct: 10 },
      { text: '初始化 25+ 功能模块', pct: 30 },
      { text: '启动 Express 网关 + 因果链', pct: 50 },
      { text: '连接 50 台云手机设备', pct: 70 },
      { text: '启动引流转化引擎', pct: 85 },
      { text: '就绪', pct: 100 },
    ];
    let i = 0;
     nextStep() {
      if (i >= steps.length) return;
      const s = steps[i];
      document.getElementById('step').textContent = s.text;
      document.getElementById('progress').style.width = s.pct + '%';
      i++;
      if (i < steps.length) {
        setTimeout(nextStep, 1500 + Math.random() * 2000);
      }
    }
    setTimeout(nextStep, 500);
  </script>
</body>
</html>
